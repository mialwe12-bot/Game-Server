name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Version passend zum pg_dump aus den Ubuntu-Paketen (Backup-Test)
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gs
          POSTGRES_PASSWORD: gs
          POSTGRES_DB: gameserver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gs:gs@localhost:5432/gameserver_test
      DATABASE_URL_TEST: postgresql://gs:gs@localhost:5432/gameserver_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: PostgreSQL-Client (pg_dump für Backup-Tests)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gameserver/shared build
      - run: pnpm --filter @gameserver/server db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @gameserver/web build
